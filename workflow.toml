schema_version = 1
project = "gotth-stack"
profile = "strict"
active = "v1.operation-journal"

[settings]
worktree_root = "worktrees"
workflow_root = "workflow"
default_branch = "main"

[toolchain]
build = "go build -mod=readonly ./cmd/gotth-stack"
test = "go test -mod=readonly -race -cover ./..."
lint = "go vet -mod=readonly ./..."
format = "gofmt -w"
coverage = "go test -mod=readonly -coverprofile=coverage.out ./..."

[coverage]
map = "workflow/artifacts/global-coverage-map.md"
profile = "strict"
block_unresolved_high_risk = true
exception_expiry_days = 14

[feature."v0.plan-kernel"]
id = "v0.plan-kernel"
slug = "plan-kernel"
name = "Strict non-mutating stack plan kernel"
namespace = "stack"
parent = ""
state = "done"
risk = "critical"
assurance = "traceable-tests"
created_at = "2026-09-14T04:42:00Z"
activated_at = "2026-09-14T04:42:00Z"
updated_at = "2026-09-14T05:04:20Z"
completed_at = "2026-09-14T05:04:20Z"
folder = "workflow/features/v0-plan-kernel"
worktree = "."
branch = "workflow/feature/v0-plan-kernel"
scope = ["Strict secret-free stack manifest", "Deterministic dependency planner", "SHA-256 manifest and plan binding", "Read-only validate and plan CLI", "Hostile parser and graph verification"]
non_goals = ["Apply or host mutation", "Adapter loading", "Network access", "Secret values", "Docker or systemd invocation", "Live deployment", "Administrator UI"]
affected_files = ["*.md", "*.go", "go.mod", ".go-version", ".gitignore", "Makefile", "LICENSE", "cmd/**", "pkg/**", "docs/**", "workflow.toml", "workflow.events.jsonl", "workflow/**"]
invariants = ["V0 is side-effect free after opening one local input file", "Secret values have no representation", "Rejection errors do not echo attacker-controlled values", "Plan output is deterministic across declaration order", "No apply or arbitrary command path exists"]
acceptance = ["Strict input and every graph failure reject without partial output", "Equivalent manifests produce identical digests and plans", "Public API and CLI gates pass", "Race, repeat, shuffle, fuzz, clean-clone, coverage, and two cold reviews pass"]

[feature."v0.plan-kernel".rollback]
strategy = "delete_unpublished_repository_or_revert_feature_commit"
notes = "V0 performs no external mutation and has no consumer pin or release"
data_loss_risk = false
requires_migration_down = false

[[feature."v0.plan-kernel".interface]]
name = "Manifest and plan Go API plus CLI"
kind = "api"
stability = "unstable-unreleased"
change = "new"

[[feature."v0.plan-kernel".verification]]
id = "verify"
kind = "unit"
command = "make verify"
required = true
timeout_seconds = 1200
side_effect = "local_write"
network = false
retries = 0

[[feature."v0.plan-kernel".verification]]
id = "hostile-repeat"
kind = "regression"
command = "go test -mod=readonly -race -count=100 ./pkg/stack"
required = true
timeout_seconds = 1200
side_effect = "local_write"
network = false
retries = 0

